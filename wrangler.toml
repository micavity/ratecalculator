name = "ratecalculator"
main = "src/index.js"
compatibility_date = "2025-01-01"
# Keep variables set in the Cloudflare dashboard when deploying from GitHub
keep_vars = true

# Static pages. Files here are served directly; other requests go to src/index.js.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

# Stripe prices (not secret). The secret key and webhook
# signing secret are set in the Cloudflare dashboard.
[vars]
STRIPE_PRICE_MONTHLY = "price_1UUskPLelV3WIKMlwTXcetQ5"
STRIPE_PRICE_YEARLY = "price_1UUskPLelV3WIKMlMR8INnqV"
# Pro prices. Pro shows as "Coming soon" if these are removed.
STRIPE_PRICE_PRO_MONTHLY = "price_1UUuraLelV3WIKMlZARMlnXF"
STRIPE_PRICE_PRO_YEARLY = "price_1UUurtLelV3WIKMlVuHxQ7vp"
# Ultra prices. Ultra shows as "Coming soon" if these are removed.
STRIPE_PRICE_ULTRA_MONTHLY = "price_1UUxy0LelV3WIKMlkZjhDO6h"
STRIPE_PRICE_ULTRA_YEARLY = "price_1UUxyhLelV3WIKMltYGMEUNF"

# Refresh stale creator stats every 6 hours
[triggers]
crons = ["17 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "creatorgg"
database_id = "7bcb071d-e872-471e-9f6d-9cd433b9ad5c"
